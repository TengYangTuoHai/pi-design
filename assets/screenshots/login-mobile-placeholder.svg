<svg width="390" height="844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg)"/>
  
  <!-- Phone Frame -->
  <rect x="0" y="0" width="390" height="44" fill="#000000" opacity="0.9"/>
  <text x="195" y="28" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">9:41</text>
  
  <!-- Content Area -->
  <g transform="translate(35, 172)">
    <!-- Card -->
    <rect x="0" y="0" width="320" height="500" rx="16" fill="#161d2b" opacity="0.8"/>
    
    <!-- Logo placeholder -->
    <circle cx="160" cy="60" r="28" fill="#3b82f6" opacity="0.3"/>
    
    <!-- Title -->
    <rect x="100" y="120" width="120" height="20" rx="4" fill="#e5e7eb" opacity="0.9"/>
    
    <!-- Inputs -->
    <rect x="24" y="180" width="272" height="48" rx="8" fill="#0f131c" opacity="0.6"/>
    <rect x="40" y="193" width="70" height="12" rx="2" fill="#6b7280" opacity="0.5"/>
    
    <rect x="24" y="248" width="272" height="48" rx="8" fill="#0f131c" opacity="0.6"/>
    <rect x="40" y="261" width="90" height="12" rx="2" fill="#6b7280" opacity="0.5"/>
    
    <!-- Forgot password -->
    <rect x="190" y="312" width="106" height="12" rx="2" fill="#3b82f6" opacity="0.4"/>
    
    <!-- Button -->
    <rect x="24" y="360" width="272" height="48" rx="24" fill="#3b82f6"/>
    <text x="160" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Sign In</text>
    
    <!-- Sign up link -->
    <rect x="80" y="432" width="160" height="12" rx="2" fill="#6b7280" opacity="0.4"/>
  </g>
  
  <!-- Watermark -->
  <text x="195" y="810" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" opacity="0.6">
    Mobile View (390x844)
  </text>
  <text x="195" y="828" font-family="monospace" font-size="10" fill="#3b82f6" text-anchor="middle" opacity="0.5">
    📱 iPhone 14
  </text>
</svg>