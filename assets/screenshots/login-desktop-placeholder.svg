<svg width="1280" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  
  <!-- Browser Chrome -->
  <rect x="0" y="0" width="1280" height="40" fill="#0f1419" opacity="0.9"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="6" fill="#febc2e"/>
  <circle cx="60" cy="20" r="6" fill="#28c840"/>
  
  <!-- Content Area -->
  <g transform="translate(440, 200)">
    <!-- Card -->
    <rect x="0" y="0" width="400" height="400" rx="16" fill="#161d2b" opacity="0.8"/>
    
    <!-- Logo placeholder -->
    <circle cx="200" cy="80" r="32" fill="#3b82f6" opacity="0.3"/>
    
    <!-- Title -->
    <rect x="120" y="140" width="160" height="24" rx="4" fill="#e5e7eb" opacity="0.9"/>
    
    <!-- Inputs -->
    <rect x="40" y="200" width="320" height="48" rx="8" fill="#0f131c" opacity="0.6"/>
    <rect x="60" y="213" width="80" height="12" rx="2" fill="#6b7280" opacity="0.5"/>
    
    <rect x="40" y="268" width="320" height="48" rx="8" fill="#0f131c" opacity="0.6"/>
    <rect x="60" y="281" width="100" height="12" rx="2" fill="#6b7280" opacity="0.5"/>
    
    <!-- Button -->
    <rect x="40" y="340" width="320" height="48" rx="24" fill="#3b82f6"/>
    <text x="200" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Sign In</text>
  </g>
  
  <!-- Watermark -->
  <text x="640" y="760" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" opacity="0.6">
    pi-design Example: Login Page (Desktop 1280x800)
  </text>
  <text x="640" y="780" font-family="monospace" font-size="12" fill="#3b82f6" text-anchor="middle" opacity="0.5">
    👆 Run: open examples/01-login-page/.design/prototype/screens/login.html
  </text>
</svg>